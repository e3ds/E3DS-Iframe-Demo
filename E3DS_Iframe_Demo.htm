<!DOCTYPE html>
<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="HandheldFriendly" content="true" />
    <title>E3DS Iframe Demo</title>
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="./images/favicon.png"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js" integrity="sha512-U6K1YLIFUWcvuw5ucmMtT9HH4t0uz3M366qrF5y4vnyH6dgDzndlcGvH/Lz5k8NFh80SN95aJ5rqGZEdaQZ7ZQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link type="text/css" rel="stylesheet" href="./css/style.css" />
    <script type="text/javascript" src="./js/message.js"></script>
    <script type="text/javascript" src="./js/demo.js"></script>

    <style type="text/css">
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      #content {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: 0px;
      }
    </style>
    <!-- YOUR CODE GOES HERE -->
    <script type="text/javascript" src="js/eventHandler.js"></script>
  </head>
  <body>
    <div
      id="loaderStep1"
      style="
        visibility: visible;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
        position: relative;
      "
      class="loader"
    >
      <div class="loader-header">
        <img src="./images/Loading2.gif" alt=""/>
      </div>
      <div
      style="
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, 20%);
      display: block;
      "
      >
        <h2
        style="
        text-align: center;
        "
        >This is your custom loading screen. Modify as your requirements.</h2>
        <p
        id="customLoaderMessage"
        style="
        text-align: center;
        "
        >

        </p>
      </div>
    </div>
    <div id="wrapperdiv">
      <div class="wrapper d-flex align-items-stretch">
        <div class="left-container">
          <div class="flexstretch show" id="sidebar" style="display: none">
            <div class="sidebar left">
              <ul class="list-sidebar bg-defoult">
                <li class="active">
                  <a onclick="switchTo('2')">
                    <span class="nav-label">Open URL</span></a
                  >
                </li>
                <li>
                  <a onclick="switchTo('9')">
                    <span class="nav-label">Get User Device Info</span></a
                  >
                </li>
                <li>
                  <a data-bs-toggle="modal" data-bs-target="#exampleModal">
                    <span class="nav-label">Change Resolution</span></a
                  >
                </li>
              </ul>

              <div class="float_left" style="display: none">
                <a href="javascript:;" class="button-left close-btn"
                  ><span class="button_collapse"></span
                ></a>
              </div>
            </div>
          </div>
          <button
            type="button"
            class="menuButton left-right-arrow menu-toggle"
            id="menuButton"
            onclick="menuToggle()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="arrow-svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12.75 15l3-3m0 0l-3-3m3 3h-7.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          </button>
        </div>

        <div id="content">
          <div id="player">
            <div id="content">
              <iframe
                allow="camera;microphone"
                style="visibility: hidden"
                id="iframe_1"
                src="https://connector.eagle3dstreaming.com/v5/demo/E3DSFeaturesTemplate/E3DS-Iframe-Demo"
                width="100%"
                height="100%"
                allowfullscreen
              >
              </iframe>
            </div>
          </div>
          <!---Start footer-->
          <a
            style="visibility: hidden"
            id="ck-fullscreen"
            class="full-screen-btn"
            onclick="goToFullScreen()"
          >
            <span class="footer-icon fullscreen-icon"></span>
          </a>
          <!--End Footer-->
        </div>

      </div>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="exampleModal" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title text-black-50" id="exampleModalLabel">Change Resolution</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="resForm" class="form-inline" onsubmit="resSubmit(event)">
              <div class="input-group">
                <input name="width" class="form-control me-2" type="number" required onclick="modalInputFocus(event)">
                <strong class="my-auto mx-auto text-dark">X</strong>
                <input name="height" class="form-control ms-2" type="number" required onclick="modalInputFocus(event)">
              </div>    
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" form="resForm" class="btn btn-primary" data-bs-dismiss="modal">Save Changes</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      $('body').click(function () {
        $('#iframe_1').focus();
      });
    </script>
    <script type="text/javascript" src="./_js/active-element.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
