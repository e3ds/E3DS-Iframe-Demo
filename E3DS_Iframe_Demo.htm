<!DOCTYPE html>
<html>
  <head>
    <!-- <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="HandheldFriendly" content="true" />
    <title>E3DS Iframe Demo</title>
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="./images/favicon.png"
    />

    <script type="text/javascript" src="./images/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link type="text/css" rel="stylesheet" href="./css/style.css" />
    <script defer type="text/javascript" src="./js/message.js"></script>
    <script defer type="text/javascript" src="./js/demo.js"></script>

    <style type="text/css">
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      #content {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: 0px;
      }
    </style>
    <!-- YOUR CODE GOES HERE -->
    <script defer type="text/javascript" src="js/eventHandler.js"></script>
  </head>
  <body>
    <div
      id="loaderStep1"
      style="
        visibility: visible;
        top: 0px;
        left: 0px;
        width: 100%;
        height: 100%;
      "
      class="loader"
    >
      <div class="loader-header">
        <video id="loadingVideo" muted autoplay src="https://storage.googleapis.com/e3ds-public-assets/demo/VideoAssets/NextGenGamesReel.mp4"></video>
      </div>
    </div>

    <div id="wrapperdiv">
      <div class="wrapper d-flex align-items-stretch">

        <div id="content">
          <div id="player">
            <div id="content">
              <iframe
                allow="camera;microphone"
                style="visibility: hidden"
                id="iframe_1"
                src="https://connector.eagle3dstreaming.com/v5/demo/E3DSFeaturesTemplate/E3DS-Iframe-Demo"
                width="100%"
                height="100%"
                allowfullscreen
              >
              </iframe>
            </div>
          </div>
          <!---Start footer-->
          <a
            style="visibility: hidden"
            id="ck-fullscreen"
            class="full-screen-btn"
            onclick="goToFullScreen()"
          >
            <span class="footer-icon fullscreen-icon"></span>
          </a>
          <!--End Footer-->
        </div>

      </div>
    </div>

    <script>
      $('body').click(function () {
        $('#iframe_1').focus();
      });
    </script>
    <script type="text/javascript" src="./_js/active-element.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </body>
</html>
